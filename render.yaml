services:
  - type: web
    name: slideshift
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render's default runtime moved to Python 3.14, where mcp==1.29.1
      # requires starlette>=0.48.0 -- incompatible with fastapi==0.115.0's
      # starlette<0.39.0 pin. Pin to the version this was built/tested
      # against instead of bumping fastapi.
      - key: PYTHON_VERSION
        value: 3.12.10
