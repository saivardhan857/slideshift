<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlideShift</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 44px 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 2px 32px rgba(0,0,0,0.09);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #6e6e73;
      margin-bottom: 32px;
    }

    /* Upload boxes */
    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .upload-box {
      border: 2px dashed #d2d2d7;
      border-radius: 14px;
      padding: 18px 16px;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      position: relative;
    }

    .upload-box:hover, .upload-box.drag-over {
      border-color: #0071e3;
      background: #f0f6ff;
    }

    .upload-box.has-file {
      border-color: #34c759;
      background: #f0faf3;
      border-style: solid;
    }

    .upload-box input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .upload-icon {
      font-size: 26px;
      flex-shrink: 0;
      line-height: 1;
    }

    .upload-text { flex: 1; min-width: 0; }

    .upload-label {
      font-size: 11px;
      font-weight: 700;
      color: #aeaeb2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .upload-name {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upload-hint { color: #aeaeb2; }

    .upload-size {
      font-size: 12px;
      color: #6e6e73;
      margin-top: 1px;
    }

    /* Saved template row */
    .saved-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      background: #f0faf3;
      border: 1.5px solid #34c759;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .saved-icon { font-size: 20px; flex-shrink: 0; }

    .saved-text { flex: 1; min-width: 0; }
    .saved-label {
      font-size: 11px;
      font-weight: 700;
      color: #34c759;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 1px;
    }
    .saved-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-text {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #aeaeb2;
      padding: 0;
    }
    .btn-text:hover { color: #ff3b30; }

    .btn-change {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #0071e3;
      padding: 0;
    }
    .btn-change:hover { text-decoration: underline; }

    /* Remember checkbox */
    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #6e6e73;
      margin-top: 8px;
      cursor: pointer;
      user-select: none;
    }

    /* Transfer button */
    #transferBtn {
      width: 100%;
      padding: 15px;
      background: #0071e3;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.18s, opacity 0.18s;
    }

    #transferBtn:hover:not(:disabled) { background: #0064cc; }
    #transferBtn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* Error */
    .error-box {
      background: #fff2f2;
      border: 1px solid #ff3b30;
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 13px;
      color: #8b0000;
      margin-top: 16px;
      display: none;
    }

    /* Progress */
    .progress-section {
      display: none;
      margin-top: 28px;
    }

    .progress-bar-track {
      height: 5px;
      background: #e8e8ed;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #0071e3;
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    .progress-status {
      font-size: 14px;
      color: #3a3a3c;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .progress-sub {
      font-size: 12px;
      color: #aeaeb2;
    }

    /* Result */
    .result-section {
      display: none;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f5;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .result-icon { font-size: 28px; }

    .result-title {
      font-size: 17px;
      font-weight: 700;
    }
    .result-title.success { color: #1d1d1f; }
    .result-title.warn { color: #ff9f0a; }
    .result-title.error { color: #ff3b30; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: #f5f5f7;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-label {
      font-size: 11px;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 1px;
    }

    .diag {
      font-size: 12px;
      color: #86868b;
      margin: -6px 0 16px;
      line-height: 1.5;
    }

    .warnings-box {
      background: #fff9f0;
      border: 1px solid #ffd60a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #6e3a00;
      margin-bottom: 14px;
    }

    .warnings-box ul { padding-left: 16px; margin-top: 6px; }
    .warnings-box li { margin-bottom: 4px; }

    .cw-title {
      font-size: 13px;
      font-weight: 700;
      color: #ff9f0a;
      margin-bottom: 8px;
    }

    .cw-item {
      background: #fff9f0;
      border: 1px solid #ffd60a;
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .cw-slide { font-weight: 700; margin-bottom: 2px; }
    .cw-msg { color: #6e3a00; }

    .download-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: #34c759;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.18s;
      margin-bottom: 10px;
    }

    .download-btn:hover { background: #28a745; }
    .download-btn.downloading { background: #28a745; opacity: 0.7; cursor: default; }

    .reset-btn {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #0071e3;
      cursor: pointer;
      background: none;
      border: none;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .reset-btn:hover { background: #f0f6ff; }
  </style>
</head>
<body>
<div class="card">
  <h1>SlideShift</h1>
  <p class="subtitle">Transfer your slides into the college template.</p>

  <div class="upload-group">
    <!-- Source -->
    <div class="upload-box" id="sourceBox">
      <input type="file" id="sourceFile" accept=".pptx">
      <div class="upload-row">
        <div class="upload-icon">📄</div>
        <div class="upload-text">
          <div class="upload-label">Your Presentation</div>
          <div class="upload-name upload-hint" id="sourceName">Choose or drag a .pptx file</div>
          <div class="upload-size" id="sourceSize" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- Template -->
    <div id="templateSection">
      <!-- Saved template row -->
      <div id="savedRow" style="display:none" class="saved-row">
        <div class="saved-icon">🎓</div>
        <div class="saved-text">
          <div class="saved-label">Saved Template</div>
          <div class="saved-name" id="savedRowName"></div>
        </div>
        <div class="saved-actions">
          <button class="btn-text" id="clearSavedBtn" title="Remove">✕ Remove</button>
          <button class="btn-change" id="changeTemplateBtn">Change</button>
        </div>
      </div>

      <!-- Upload box (hidden when saved template active) -->
      <div class="upload-box" id="templateBox" style="display:none">
        <input type="file" id="templateFile" accept=".pptx">
        <div class="upload-row">
          <div class="upload-icon">🎓</div>
          <div class="upload-text">
            <div class="upload-label">College Template</div>
            <div class="upload-name upload-hint" id="templateName">Choose or drag a .pptx file</div>
            <div class="upload-size" id="templateSize" style="display:none"></div>
          </div>
        </div>
      </div>

      <label id="rememberLabel" class="remember-label" style="display:none">
        <input type="checkbox" id="rememberTemplate"> Remember this template for next time
      </label>
    </div>
  </div>

  <button id="transferBtn" disabled>Transfer Content</button>

  <div class="error-box" id="errorBox"></div>

  <!-- Progress -->
  <div class="progress-section" id="progressSection">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-status" id="progressStatus">Starting…</div>
    <div class="progress-sub" id="progressSub"></div>
  </div>

  <!-- Result -->
  <div class="result-section" id="resultSection">
    <div class="result-header">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
    </div>

    <div class="stats" id="statsGrid"></div>
    <div class="diag" id="diagBox" style="display:none"></div>

    <div id="contentWarningsBox" style="display:none"></div>
    <div class="warnings-box" id="warningsBox" style="display:none"></div>

    <a class="download-btn" id="downloadBtn" href="#">
      ⬇ Download Converted Presentation
    </a>
    <button class="reset-btn" id="resetBtn">Convert another file</button>
  </div>
</div>

<script>
  const sourceFile      = document.getElementById('sourceFile');
  const templateFile    = document.getElementById('templateFile');
  const sourceBox       = document.getElementById('sourceBox');
  const templateBox     = document.getElementById('templateBox');
  const sourceName      = document.getElementById('sourceName');
  const templateName    = document.getElementById('templateName');
  const sourceSize      = document.getElementById('sourceSize');
  const templateSize    = document.getElementById('templateSize');
  const transferBtn     = document.getElementById('transferBtn');
  const progressSection = document.getElementById('progressSection');
  const progressFill    = document.getElementById('progressFill');
  const progressStatus  = document.getElementById('progressStatus');
  const progressSub     = document.getElementById('progressSub');
  const resultSection   = document.getElementById('resultSection');
  const errorBox        = document.getElementById('errorBox');
  const resetBtn        = document.getElementById('resetBtn');
  const savedRow        = document.getElementById('savedRow');
  const savedRowName    = document.getElementById('savedRowName');
  const clearSavedBtn   = document.getElementById('clearSavedBtn');
  const changeTemplateBtn = document.getElementById('changeTemplateBtn');
  const rememberLabel   = document.getElementById('rememberLabel');
  const rememberTemplate = document.getElementById('rememberTemplate');
  const downloadBtn     = document.getElementById('downloadBtn');

  let savedTemplate = null;
  let totalSlides = 0;

  // Progress bar step → percentage
  const STEP_PCT = {
    parsed:           12,
    reading_template: 22,
    matching:         32,
    transferring:     35,   // base; increases with slide progress
    saving:           90,
    validating:       95,
  };

  const STEP_LABELS = {
    parsed:           'Reading your presentation…',
    reading_template: 'Loading college template…',
    matching:         'Matching slide layouts…',
    transferring:     'Transferring content…',
    saving:           'Creating PowerPoint file…',
    validating:       'Validating output…',
  };

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  function setProgress(pct, label, sub) {
    progressFill.style.width = pct + '%';
    if (label) progressStatus.textContent = label;
    progressSub.textContent = sub || '';
  }

  // --- Saved template management ---

  function showTemplateUpload() {
    savedRow.style.display = 'none';
    templateBox.style.display = 'block';
  }

  function showSavedTemplate(info) {
    savedTemplate = info;
    savedRowName.textContent = info.filename;
    savedRow.style.display = 'flex';
    templateBox.style.display = 'none';
    rememberLabel.style.display = 'none';
    templateFile.value = '';
    templateName.textContent = 'Choose or drag a .pptx file';
    templateBox.classList.remove('has-file');
    templateSize.style.display = 'none';
    updateBtn();
  }

  async function loadSavedTemplate() {
    try {
      const res = await fetch('/api/template/info');
      const info = await res.json();
      if (info.saved) {
        showSavedTemplate(info);
        return;
      }
    } catch (e) {}
    showTemplateUpload();
    updateBtn();
  }

  clearSavedBtn.addEventListener('click', async () => {
    await fetch('/api/template', { method: 'DELETE' });
    savedTemplate = null;
    showTemplateUpload();
    updateBtn();
  });

  changeTemplateBtn.addEventListener('click', () => {
    savedTemplate = null;
    showTemplateUpload();
    updateBtn();
  });

  // --- File selection ---

  function updateBtn() {
    const hasSource = !!sourceFile.files[0];
    const hasTemplate = !!(templateFile.files[0] || savedTemplate);
    transferBtn.disabled = !(hasSource && hasTemplate);
  }

  function setFileInfo(file, nameEl, sizeEl, box) {
    if (file) {
      nameEl.textContent = file.name;
      nameEl.classList.remove('upload-hint');
      sizeEl.textContent = formatSize(file.size);
      sizeEl.style.display = 'block';
      box.classList.add('has-file');
    } else {
      nameEl.textContent = 'Choose or drag a .pptx file';
      nameEl.classList.add('upload-hint');
      sizeEl.style.display = 'none';
      box.classList.remove('has-file');
    }
  }

  sourceFile.addEventListener('change', () => {
    setFileInfo(sourceFile.files[0], sourceName, sourceSize, sourceBox);
    updateBtn();
  });

  templateFile.addEventListener('change', () => {
    setFileInfo(templateFile.files[0], templateName, templateSize, templateBox);
    rememberLabel.style.display = templateFile.files[0] ? 'flex' : 'none';
    updateBtn();
  });

  // Drag-over visual
  [sourceBox, templateBox].forEach(box => {
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag-over'); });
    box.addEventListener('dragleave', () => box.classList.remove('drag-over'));
    box.addEventListener('drop', () => setTimeout(() => box.classList.remove('drag-over'), 50));
  });

  // --- Error / Result helpers ---

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    transferBtn.disabled = false;
    transferBtn.textContent = 'Transfer Content';
    progressSection.style.display = 'none';
  }

  function showResult(data) {
    setProgress(100, 'Done!');
    setTimeout(() => { progressSection.style.display = 'none'; }, 500);
    resultSection.style.display = 'block';

    const hasWarnings = data.slides_requiring_review && data.slides_requiring_review.length > 0;

    document.getElementById('resultIcon').textContent = hasWarnings ? '⚠️' : '✅';
    const titleEl = document.getElementById('resultTitle');
    if (hasWarnings) {
      titleEl.textContent = `Transfer complete — ${data.slides_requiring_review.length} slide(s) need review`;
      titleEl.className = 'result-title warn';
    } else {
      titleEl.textContent = 'Transfer complete!';
      titleEl.className = 'result-title success';
    }

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat">
        <div class="stat-val">${data.slides_processed}</div>
        <div class="stat-label">Slides</div>
      </div>
      <div class="stat">
        <div class="stat-val">${data.slides_output}</div>
        <div class="stat-label">Transferred</div>
      </div>
      <div class="stat">
        <div class="stat-val">${data.slides_requiring_review ? data.slides_requiring_review.length : 0}</div>
        <div class="stat-label">Review needed</div>
      </div>
    `;

    // Diagnostics summary (Phase 4) — compact, only shows what actually happened
    const diagBox = document.getElementById('diagBox');
    const d = data.diagnostics;
    if (d) {
      const parts = [];
      if (d.spacing_reduction_count > 0)
        parts.push(`auto-fitted ${d.spacing_reduction_count} slide${d.spacing_reduction_count === 1 ? '' : 's'}`);
      if (d.overflow_count > 0)
        parts.push(`${d.overflow_count} couldn't fully fit`);
      if (d.grouped_shape_salvage_count > 0)
        parts.push(`${d.grouped_shape_salvage_count} grouped shape${d.grouped_shape_salvage_count === 1 ? '' : 's'}: text recovered`);
      if (d.unsupported_shape_count > 0)
        parts.push(`${d.unsupported_shape_count} unsupported object${d.unsupported_shape_count === 1 ? '' : 's'} skipped`);
      const secs = d.total_seconds;
      parts.push(secs != null ? `processed in ${secs < 1 ? '<1s' : secs.toFixed(1) + 's'}` : null);
      const text = parts.filter(Boolean).join(' · ');
      if (text) { diagBox.textContent = text; diagBox.style.display = 'block'; }
    }

    const cwBox = document.getElementById('contentWarningsBox');
    if (data.content_warnings && data.content_warnings.length > 0) {
      cwBox.style.display = 'block';
      const items = data.content_warnings.map(w =>
        `<div class="cw-item"><div class="cw-slide">Slide ${w.slide}</div><div class="cw-msg">${w.message}</div></div>`
      ).join('');
      cwBox.innerHTML = `<div class="cw-title">⚠ Slides needing attention</div>${items}`;
    }

    const cwSlides = new Set((data.content_warnings || []).map(w => w.slide));
    const otherWarnings = (data.warnings || []).filter(w => {
      const m = w.match(/Slide (\d+)/);
      return !m || !cwSlides.has(parseInt(m[1]));
    });
    if (otherWarnings.length > 0) {
      const wb = document.getElementById('warningsBox');
      wb.style.display = 'block';
      wb.innerHTML = '<strong>Review notes:</strong><ul>' +
        otherWarnings.map(w => `<li>${w}</li>`).join('') + '</ul>';
    }

    downloadBtn.href = data.download_url;
    downloadBtn.download = data.filename || 'Converted_Presentation.pptx';
    transferBtn.textContent = 'Transfer Content';

    // Auto-trigger download
    setTimeout(() => downloadBtn.click(), 600);
  }

  // --- Transfer ---

  async function runTransfer() {
    errorBox.style.display = 'none';
    resultSection.style.display = 'none';
    document.getElementById('contentWarningsBox').style.display = 'none';
    document.getElementById('contentWarningsBox').innerHTML = '';
    document.getElementById('warningsBox').style.display = 'none';
    document.getElementById('diagBox').style.display = 'none';
    document.getElementById('diagBox').textContent = '';
    progressSection.style.display = 'block';
    totalSlides = 0;
    setProgress(5, 'Reading your presentation…', '');
    transferBtn.disabled = true;
    transferBtn.textContent = 'Transferring…';

    // Save template if "Remember" checked
    if (rememberTemplate.checked && templateFile.files[0]) {
      const tplForm = new FormData();
      tplForm.append('template', templateFile.files[0]);
      try {
        const saveRes = await fetch('/api/template', { method: 'POST', body: tplForm });
        if (saveRes.ok) {
          const info = await saveRes.json();
          showSavedTemplate(info);
        }
      } catch (e) {}
    }

    const formData = new FormData();
    formData.append('source', sourceFile.files[0]);
    if (templateFile.files[0]) formData.append('template', templateFile.files[0]);

    let res;
    try {
      res = await fetch('/api/transfer', { method: 'POST', body: formData });
    } catch (e) {
      showError('Could not connect to the server. Make sure the app is running.');
      return;
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      showError(err.detail || 'Transfer failed. Check your files and try again.');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data: ')) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }

          if (ev.type === 'progress') {
            if (ev.step === 'parsed' && ev.total_slides) {
              totalSlides = ev.total_slides;
              setProgress(STEP_PCT.parsed, STEP_LABELS.parsed, `${totalSlides} slides found`);
            } else if (ev.step === 'transferring' && ev.slide) {
              const [cur, tot] = ev.slide.split('/').map(Number);
              const base = STEP_PCT.transferring;
              const pct = base + ((cur / (tot || 1)) * 55);
              setProgress(pct, 'Transferring content…', `Slide ${cur} of ${tot}`);
            } else if (STEP_PCT[ev.step] !== undefined) {
              setProgress(STEP_PCT[ev.step], STEP_LABELS[ev.step] || '', '');
            }
          } else if (ev.type === 'done') {
            showResult(ev);
            return;
          } else if (ev.type === 'error') {
            showError(ev.message || 'An error occurred.');
            return;
          }
        }
      }
    } catch (e) {
      showError('Connection lost during transfer. Please try again.');
    }
  }

  transferBtn.addEventListener('click', runTransfer);

  // Enter key shortcut
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !transferBtn.disabled && resultSection.style.display === 'none') {
      runTransfer();
    }
  });

  resetBtn.addEventListener('click', () => {
    sourceFile.value = '';
    templateFile.value = '';
    setFileInfo(null, sourceName, sourceSize, sourceBox);
    setFileInfo(null, templateName, templateSize, templateBox);
    rememberLabel.style.display = 'none';
    rememberTemplate.checked = false;
    resultSection.style.display = 'none';
    progressSection.style.display = 'none';
    errorBox.style.display = 'none';
    transferBtn.textContent = 'Transfer Content';
    totalSlides = 0;
    updateBtn();
  });

  // Init
  loadSavedTemplate();
</script>
</body>
</html>
